<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D&D Dice Roller - iPod Touch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 10px;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #d4af37;
        }
        .dice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .dice-btn {
            background-color: #2c2c2c;
            border: 2px solid #d4af37;
            color: #fff;
            padding: 12px 5px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .dice-btn:active {
            background-color: #d4af37;
            color: #1a1a1a;
        }
        .modifiers {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .modifiers label {
            font-size: 0.9rem;
        }
        .modifiers input {
            width: 50px;
            padding: 5px;
            text-align: center;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
        }
        .result-box {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            min-height: 90px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #total-display {
            font-size: 2rem;
            font-weight: bold;
            color: #4ade80;
        }
        #detail-display {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 4px;
            word-break: break-all;
        }
        .clear-btn {
            background-color: #7f1d1d;
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>D&D Dice Roller</h1>

    <div class="dice-grid">
        <button class="dice-btn" onclick="rollDice(4)">d4</button>
        <button class="dice-btn" onclick="rollDice(6)">d6</button>
        <button class="dice-btn" onclick="rollDice(8)">d8</button>
        <button class="dice-btn" onclick="rollDice(10)">d10</button>
        <button class="dice-btn" onclick="rollDice(12)">d12</button>
        <button class="dice-btn" onclick="rollDice(20)">d20</button>
        <button class="dice-btn" onclick="rollDice(100)">d100</button>
    </div>

    <div class="modifiers">
        <label for="mod">Modificador:</label>
        <input type="number" id="mod" value="0">
    </div>

    <div class="result-box">
        <div id="total-display">0</div>
        <div id="detail-display">Toca un dado para tirar</div>
    </div>

    <button class="clear-btn" onclick="resetLog()">Limpiar</button>

    <script>
        function rollDice(sides) {
            const modInput = parseInt(document.getElementById('mod').value) || 0;
            const roll = Math.floor(Math.random() * sides) + 1;
            const total = roll + modInput;

            document.getElementById('total-display').innerText = total;
            
            let detailText = `d${sides}: [${roll}]`;
            if (modInput !== 0) {
                detailText += ` ${modInput >= 0 ? '+' : ''}${modInput}`;
            }
            document.getElementById('detail-display').innerText = detailText;
        }

        function resetLog() {
            document.getElementById('total-display').innerText = '0';
            document.getElementById('detail-display').innerText = 'Toca un dado para tirar';
            document.getElementById('mod').value = '0';
        }
    </script>
</body>
</html>
