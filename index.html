<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Configuración para que parezca una App Nativa en iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Dados D&D</title>
    
    <!-- FAVICON INTEGRADO (Dado D20 en formato PNG) -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #e2d8b2;
            margin-bottom: 10px;
        }
        .display {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-main {
            font-size: 3rem;
            font-weight: bold;
            color: #ffca28;
        }
        .result-detail {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .dice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .dice-btn {
            background: linear-gradient(145deg, #3a3a3a, #222);
            border: 1px solid #555;
            border-radius: 10px;
            color: #fff;
            padding: 15px 5px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dice-btn:active {
            background: #555;
            transform: scale(0.96);
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .controls label {
            font-size: 0.9rem;
        }
        .controls input {
            width: 50px;
            background: #1a1a1a;
            border: 1px solid #555;
            color: white;
            text-align: center;
            font-size: 1rem;
            padding: 5px;
            border-radius: 5px;
        }
        .btn-clear {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Lanzador D&D</h1>

    <div class="display">
        <div id="result" class="result-main">-</div>
        <div id="detail" class="result-detail">Selecciona un dado para tirar</div>
    </div>

    <div class="controls">
        <div>
            <label for="quantity">Cantidad: </label>
            <input type="number" id="quantity" value="1" min="1" max="20">
        </div>
        <div>
            <label for="modifier">Modificador: </label>
            <input type="number" id="modifier" value="0">
        </div>
    </div>

    <div class="dice-grid">
        <button class="dice-btn" onclick="rollDice(4)">d4</button>
        <button class="dice-btn" onclick="rollDice(6)">d6</button>
        <button class="dice-btn" onclick="rollDice(8)">d8</button>
        <button class="dice-btn" onclick="rollDice(10)">d10</button>
        <button class="dice-btn" onclick="rollDice(12)">d12</button>
        <button class="dice-btn" onclick="rollDice(20)">d20</button>
        <button class="dice-btn" onclick="rollDice(100)" style="grid-column: span 3;">d100 (Percentil)</button>
    </div>

    <button class="btn-clear" onclick="resetDisplay()">Reiniciar</button>

    <script>
        function rollDice(sides) {
            var qtyInput = document.getElementById('quantity').value;
            var modInput = document.getElementById('modifier').value;
            
            var qty = parseInt(qtyInput) || 1;
            var mod = parseInt(modInput) || 0;
            
            if (qty < 1) qty = 1;

            var rolls = [];
            var total = 0;

            for (var i = 0; i < qty; i++) {
                var roll = Math.floor(Math.random() * sides) + 1;
                rolls.push(roll);
                total += roll;
            }

            var finalTotal = total + mod;

            document.getElementById('result').innerText = finalTotal;

            var detailText = qty + "d" + sides + " [" + rolls.join(", ") + "]";
            if (mod !== 0) {
                detailText += (mod > 0 ? " + " : " - ") + Math.abs(mod);
            }
            
            // Detección de crítico para d20
            if (sides === 20 && qty === 1) {
                if (rolls[0] === 20) {
                    detailText += " — ¡CRÍTICO!";
                } else if (rolls[0] === 1) {
                    detailText += " — ¡PIFIA!";
                }
            }

            document.getElementById('detail').innerText = detailText;
        }

        function resetDisplay() {
            document.getElementById('result').innerText = "-";
            document.getElementById('detail').innerText = "Selecciona un dado para tirar";
            document.getElementById('quantity').value = 1;
            document.getElementById('modifier').value = 0;
        }
    </script>
</body>
</html>
